<style>

t);color:#1d1608;border-color:var(--accent)}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.seg button{padding:10px;border-radius:12px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);font-weight:700}.seg button.active{background:var(--accent);color:#1d1608;border-color:var(--accent)}.field{display:flex;flex-direction:column;gap:6px}.field{min-width:0}.field input,.field select{width:100%;min-width:0;max-width:100%;background:#101923;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}.team{border-radius:18px;padding:14px;background:var(--surface)}.team.a{border-left:5px solid var(--a)}.team.b{border-left:5px solid var(--b)}.team-player{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.team-player:last-child{border:0}.vs{text-align:center;font-size:28px;font-weight:900;color:var(--muted);margin:6px}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px}.scoreteam span{font-size:12px;font-weight:900;letter-spacing:1px}.scoreteam strong{display:block;font-size:58px;line-height:1}.timer{font-size:22px;font-weight:900;margin-top:8px}.timer.danger{color:#ff686f}.timer-controls{display:flex;gap:6px;justify-content:center;margin-top:8px}.timer-btn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:14px;display:grid;place-items:center;padding:0}.toggle-yn{font-weight:900;border:none}.toggle-yn.yes{background:var(--ok);color:#06281c}.toggle-yn.no{background:var(--danger);color:#fff}.pelada-card{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;color:var(--text);margin-top:10px;cursor:pointer}.pelada-card .chev{font-size:20px;color:var(--accent)}.player.arrived{outline-color:var(--ok)!important}.arrived .check{background:var(--ok)!important;color:#06281c!important;bord .profile-card{background:var(--surface);border-radius:24px;max-width:380px;width:100%;overflow:hidden;position:relative;animation:profilePop .22s ease;box-shadow:0 20px 60px rgba(0,0,0,.5)}
@keyframes profilePop{from{transform:scale(.9) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

.profile-banner:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.18),transparent 60%)}
.profile-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;border:none;font-size:16px;z-index:3;cursor:pointer}
.profile-photo-wrap{width:100px;height:100px;border-radius:50%;background:var(--surface2);border:4px solid var(--surface);position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:32px;overflow:hidden;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.profile-photo-wrap img{width:100%;height:100%;object-fit:cover}.profile-photo-wrap.gold{background:linear-gradient(150deg,#fff6d8 0%,#ffcf40 40%,#a8720a 100%)!important;border:4px solid #fff2c2!important;box-shadow:0 0 0 3px #ffd76a,0 0 26px 6px rgba(255,196,50,.65);position:relative}
.profile-photo-wrap.gold:after{content:"\1F451";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.profile-card.gold-frame{border:2px solid #ffd76a;box-shadow:0 0 0 1px rgba(255,215,100,.45),0 20px 60px rgba(0,0,0,.55),0 0 34px rgba(255,190,60,.4)}
.profile-card.gold-frame .profile-banner{background:linear-gradient(135deg,#7a5200 0%,#c8860a 45%,#3d2900 100%)!important}
.profile-card.gold-frame .profile-banner:after{background:radial-gradient(circle at 80% 20%,rgba(255,230,150,.35),transparent 60%)!important}.achv-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}.achv-badge{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:800}.cmp-heads{display:flex;align-items:center;justify-content:center;gap:16px;margin:16px 0 20px}
.cmp-head{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center}
.cmp-head strong{font-size:14px}
.cmp-vs{font-weight:900;color:var(--muted);font-size:14px}
.cmp-row{margin-bottom:14px}

.cmp-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.cmp-fill{height:100%}
.cmp-fill.left{background:var(--a);border-radius:999px 0 0 999px}
.cmp-fill.right{background:var(--b);border-radius:0 999px 999px 0}

.profile-body{padding:58px 22px 24px;text-align:center}
.profile-body h2{margin:0 0 6px;font-family:"Rajdhani",sans-serif;font-size:25px;font-weight:800}
.profile-pos-pill{display:inline-block;background:var(--surface2);border:1px solid var(--line);padding:5px 13px;border-radius:999px;font-size:12px;font-weight:800;color:var(--muted);margin-top:8px;letter-spacing:.4px}
.profile-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:22px}
.pstat{background:var(--surface2);border-radius:14px;padding:14px 6px;border:1px solid var(--line)}
.pstat strong{display:block;font-family:"Rajdhani",sans-serif;font-size:23px;font-weight:800;color:var(--accent)}
.pstat span{display:block;font-size:10px;color:var(--muted);margin-top:3px;font-weight:700;letter-spacing:.2px}
.pstat.ok strong{color:var(--ok)}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goal{padding:20px 10px;border:0;border-radius:16px;color:white;font-weight:900;font-size:18px}.goal.a{background:var(--a)}.goal.b{background:var(--b)}.bayer{display:flex;gap:12px;align-items:center}.bayer>div:nth-child(2){flex:1;min-width:0}.quick-actions{display:flex;gap:10px;margin-top:12px}.icon-btn{width:52px;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:23px;display:grid;place-items:center}.queue-btn{flex:1;min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:800;padding:10px 14px;text-align:left}.ranktabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}.ranktabs button{min-width:0;padding:10px 6px;border-radius:12px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);font-weight:800;font-size:12px}.ranktabs button.active{background:var(--accent);color:#1d1608;border-color:var(--accent)}.crown{font-size:28px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99;display:grid;align-items:end}.modalbox{background:var(--surface);border-radius:24px 24px 0 0;padding:18px;max-height:78vh;overflow:auto}.modalplayer{width:100%;padding:14px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;color:var(--text);display:flex;justify-content:space-between;margin-top:8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#111b25;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:50}.nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:7px 3px}.nav button.active{color:var(--accent);font-weight:900}.nav b{display:block;font-size:19px;margin-bottom:2px}.hidden{display:none!important}.toast{background:#173428;border:1px solid #2a7256;color:#baf5d9;padding:12px;border-radius:14px;margin-bottom:14px}.empty{text-align:center;padding:34px 16px;color:var(--muted)}.rankrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.rankrow:last-child{border:0}.ranknum{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:900}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.tag{font-size:12px;padding:5px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:start}.vs{align-self:center}}

.splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 22%,#263d55 0,#162535 34%,#0f1620 68%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}.splash:before{content:'';position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,32,.10),transparent 67%);top:10%;animation:pulseGlow 2.2s ease-in-out infinite}.splash.hide{animation:splashOut .35s ease forwards;pointer-events:none}.ball-stage{position:relative;width:190px;height:190px;display:grid;place-items:center;margin-bottom:18px}.ball-shadow{position:absolute;left:50%;bottom:20px;width:96px;height:20px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.58),rgba(0,0,0,0) 72%);filter:blur(3px);animation:shadowBounce 1.55s cubic-bezier(.45,0,.55,1) infinite}.soccer-ball{width:112px;height:112px;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 23%,#fff 0 15%,#f8f8f4 32%,#deded8 65%,#a9aaa7 88%,#777 100%);box-shadow:inset -17px -20px 25px rgba(0,0,0,.28),inset 9px 8px 16px rgba(255,255,255,.8),0 22px 30px rgba(0,0,0,.36);animation:proBounce 1.55s cubic-bezier(.42,0,.38,1) infinite;z-index:2}.soccer-ball:before{content:'';position:absolute;width:33px;height:31px;left:39px;top:36px;background:#171a1c;clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}.soccer-ball:after{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 15deg at 28% 24%,transparent 0 12%,rgba(30,33,35,.92) 13% 20%,transparent 21% 43%,rgba(30,33,35,.92) 44% 51%,transparent 52% 72%,rgba(30,33,35,.88) 73% 80%,transparent 81%);opacity:.9;mix-blend-mode:multiply}.soccer-ball .patch{position:absolute;width:25px;height:23px;background:#1b1e20;clip-path:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%);z-index:3}.soccer-ball .p1{left:7px;top:25px;transform:rotate(-26deg)}.soccer-ball .p2{right:7px;top:20px;transform:rotate(31deg)}.soccer-ball .p3{left:15px;bottom:8px;transform:rotate(21deg)}.soccer-ball .p4{right:12px;bottom:10px;transform:rotate(-22deg)}.splash h1{font-size:42px;letter-spacing:2px;margin:0;font-weight:950;text-shadow:0 8px 24px rgba(0,0,0,.35);animation:titleIn .7s .18s both}.splash p{color:var(--muted);margin-top:8px;animation:titleIn .7s .3s both}.splash .tap{position:absolute;bottom:42px;font-size:14px;color:var(--muted);animation:tapPulse 1.5s ease-in-out infinite}.splash .spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px rgba(255,176,32,.8);opacity:.55;animation:sparkFloat 2.4s ease-in-out infinite}.splash .s1{left:23%;top:31%}.splash .s2{right:22%;top:38%;animation-delay:.7s}.splash .s3{left:31%;bottom:25%;animation-delay:1.2s}@keyframes proBounce{0%,100%{transform:translateY(31px) scaleY(.91) scaleX(1.05) rotate(0deg)}12%{transform:translateY(25px) scaleY(.96) scaleX(1.02) rotate(22deg)}50%{transform:translateY(-49px) scale(1) rotate(190deg)}88%{transform:translateY(18px) scaleY(.98) rotate(336deg)}}@keyframes shadowBounce{0%,100%{transform:translateX(-50%) scaleX(1.12);opacity:.7}50%{transform:translateX(-50%) scaleX(.58);opacity:.28}}@keyframes pulseGlow{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.08);opacity:1}}@keyframes titleIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes tapPulse{0%,100%{opacity:.45;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}@keyframes sparkFloat{0%,100%{transform:translateY(8px) scale(.7);opacity:.2}50%{transform:translateY(-14px) scale(1.2);opacity:.75}}@keyframes splashOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}
@media(max-width:430px){.formgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.seg{grid-template-columns:repeat(3,minmax(0,1fr))}.seg button{min-width:0;padding:10px 5px}.btn{max-width:100%} body{padding-bottom:78px}.top{padding:13px 14px}.wrap{padding:14px}.card{border-radius:16px;padding:14px}.hero h1{font-size:24px}.grid{grid-template-columns:1fr 1fr}.scoreteam strong{font-size:48px}.goal{padding:17px 8px;font-size:16px}.row{flex-wrap:wrap}.row>.btn{min-width:0}.nav button{font-size:10px}.nav b{font-size:18px}.splash h1{font-size:36px}.ball-stage{width:165px;height:165px}.soccer-ball{width:100px;height:100px}.soccer-ball:before{width:30px;height:28px;left:35px;top:33px}}
</style>
<style>
.nav{grid-template-columns:repeat(5,1fr)!important}
.matchball,.matchball svg{border-radius:50%;overflow:hidden;clip-path:circle(48% at 50% 50%)}
.date-filter{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}.date-filter input{width:100%;background:#081a30;color:var(--text);color-scheme:dark;border:1px solid var(--line);border-radius:12px;padding:12px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px}.switch{width:54px;height:30px;border:0;border-radius:999px;background:#294664;padding:3px;transition:.2s}.switch:before{content:'';display:block;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--accent)}.switch.on:before{transform:translateX(24px)}.bayer-off .bayer{display:none}

<style>

:root{--bg:#061326;--surface:#0c203b;--surface2:#122d50;--line:#21466e;--text:#f4f8ff;--muted:#91a9c5;--accent:#28a7ff;--a:#168cff;--b:#ff4f67;--ok:#38d5a3;--danger:#ff6576}
body{background:radial-gradient(circle at 50% -10%,#123d70 0,#071a31 36%,#061326 72%) fixed}.top{background:rgba(5,19,38,.92);border-bottom-color:#1d4775}.brand{display:flex;align-items:center;gap:8px;color:#fff}.brand-mark{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#25b7ff,#0866d7);box-shadow:0 7px 18px rgba(0,139,255,.32)}.pill{color:#66c7ff}.card{box-shadow:0 12px 34px rgba(0,8,24,.24)}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#0879df,#084b9d 58%,#052b62);border-color:#268fe9}.hero:after{content:'';position:absolute;width:190px;height:190px;border-radius:50%;right:-72px;top:-94px;border:28px solid rgba(255,255,255,.055)}.hero>*{position:relative;z-index:1}.btn-primary{background:linear-gradient(135deg,#2bb5ff,#0878e8);color:#fff;box-shadow:0 9px 24px rgba(0,132,255,.25)}.btn-primary:active{transform:translateY(1px)}.btn-secondary,.player,.icon-btn,.queue-btn,.modalplayer{background:#102b4b}.player.selected{background:#123c68}.selected .check,.seg button.active,.ranktabs button.active{color:#fff}.stars{color:#ffd25f}.nav{background:rgba(5,18,35,.97);border-top-color:#20456c;grid-template-columns:repeat(6,1fr)}.nav button.active{color:#4fbcff}.nav b{font-size:18px}.field input,.field select{background:#081a30}.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.sport-stat{margin:0;padding:14px;background:linear-gradient(160deg,#102d50,#0a1e37);min-height:95px}.sport-stat strong{display:block;font-size:27px;margin-top:7px}.home-kicker{color:#9ad8ff;font-weight:900;letter-spacing:1.4px}.home-block .small{color:#79caff;font-weight:900;letter-spacing:1px}.home-actions{display:grid;grid-template-columns:1.45fr .8fr;gap:10px;margin-bottom:14px}.home-actions .btn{width:100%;height:58px}.live-strip{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(40,167,255,.15),rgba(40,167,255,.04));border:1px solid #255883;border-radius:16px;padding:13px;margin-top:16px}.live-dot{width:10px;height:10px;border-radius:50%;background:#47e3a7;box-shadow:0 0 0 6px rgba(71,227,167,.12);animation:livePulse 1.5s infinite}.history-card{position:relative}.history-date{font-size:12px;color:#79caff;font-weight:900;letter-spacing:.7px}.history-score{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.score-chip{padding:7px 10px;border-radius:10px;background:#081a30;border:1px solid var(--line);font-weight:850}.history-highlights{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.highlight{background:#102b4b;border-radius:12px;padding:10px}.highlight span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.splash{background:radial-gradient(circle at 50% 32%,#1267aa 0,#082c55 34%,#041326 72%)}.splash:before{background:radial-gradient(circle,rgba(45,180,255,.22),transparent 67%)}.ball-stage{width:220px;height:210px}.matchball{width:138px;height:138px;position:relative;z-index:2;filter:drop-shadow(0 25px 20px rgba(0,0,0,.34));animation:newBall 1.8s cubic-bezier(.45,0,.38,1) infinite}.matchball svg{width:100%;height:100%;display:block}.ball-shadow{bottom:15px;width:112px;background:radial-gradient(ellipse,rgba(0,0,0,.62),rgba(0,0,0,0) 70%);animation:newShadow 1.8s ease-in-out infinite}.stadium-line{position:absolute;left:-35vw;right:-35vw;bottom:-27vh;height:45vh;border-radius:50% 50% 0 0;border-top:2px solid rgba(89,193,255,.2);background:linear-gradient(rgba(10,91,151,.15),transparent 45%)}.splash .tap{color:#a6d8f7}.splash .spark{background:#58c7ff;box-shadow:0 0 18px rgba(62,190,255,.9)}
@keyframes newBall{0%,100%{transform:translateY(32px) rotate(-9deg) scaleY(.94)}50%{transform:translateY(-43px) rotate(175deg) scale(1)}}@keyframes newShadow{0%,100%{transform:translateX(-50%) scaleX(1.1);opacity:.68}50%{transform:translateX(-50%) scaleX(.55);opacity:.25}}@keyframes livePulse{50%{opacity:.45;transform:scale(.8)}}
@media(max-width:430px){.stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.sport-stat{padding:11px;min-height:88px}.sport-stat strong{font-size:23px}.home-actions{grid-template-columns:1fr}.nav button{font-size:9px}.nav b{font-size:17px}.ball-stage{width:190px;height:185px}.matchball{width:120px;height:120px}.history-highlights{grid-template-columns:1fr 1fr}}
.live-teams{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:14px 0}.live-team{padding:0;overflow:hidden;margin:0;background:linear-gradient(180deg,#0d294a,#091d36)}.live-team.a{border-color:#168cff}.live-team.b{border-color:#ff4f67}.live-team-head{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;color:#fff}.live-team.a .live-team-head{background:linear-gradient(135deg,#168cff,#0874df)}.live-team.b .live-team-head{background:linear-gradient(135deg,#ff4f67,#e83d58)}.live-team-head strong{font-size:16px}.live-team-head span{font-size:11px;opacity:.82}.live-player{display:flex;align-items:center;gap:9px;min-width:0;padding:9px 10px;border-bottom:1px solid rgba(119,168,214,.16)}.live-player:last-child{border-bottom:0}.player-avatar{width:38px;height:38px;min-width:38px;border-radius:50%;object-fit:cover;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#24527d,#102a47);border:2px solid #168cff;color:#fff;font-size:12px;font-weight:950;text-transform:uppercase}.live-team.b .player-avatar{border-color:#ff4f67}.player-avatar img{width:100%;height:100%;object-fit:cover}.player-avatar.gold{background:linear-gradient(150deg,#fff6d8 0%,#ffcf40 40%,#a8720a 100%)!important;border:2px solid #fff2c2!important;color:#3a2400!important;box-shadow:0 0 0 3px #0f1620,0 0 0 5px #ffd76a,0 0 16px 3px rgba(255,196,50,.75);position:relative;animation:goldPulse 2.2s ease-in-out infinite}
.player-avatar.gold:after{content:"\1F451";position:absolute;top:-9px;right:-6px;font-size:13px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));animation:none}
@keyframes goldPulse{0%,100%{box-shadow:0 0 0 3px #0f1620,0 0 0 5px #ffd76a,0 0 14px 2px rgba(255,196,50,.6)}50%{box-shadow:0 0 0 3px #0f1620,0 0 0 5px #ffe58a,0 0 22px 6px rgba(255,196,50,.9)}}.live-player-info{min-width:0;flex:1}.live-player-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.live-player-info span{font-size:10px;color:var(--muted)}.goalie-mark{font-size:15px;flex:0 0 auto}.photo-field{display:flex;align-items:center;gap:12px}.photo-preview{width:58px;height:58px;min-width:58px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#102b4b;border:2px solid #28a7ff;color:#fff;font-weight:900}.photo-preview img{width:100%;height:100%;object-fit:cover}.photo-field input{padding:9px;font-size:11px}
@media(max-width:430px){.live-teams{gap:8px}.live-team-head{padding:10px}.live-team-head strong{font-size:14px}.live-team-head span{font-size:9px}.live-player{padding:8px 7px;gap:7px}.player-avatar{width:33px;height:33px;min-width:33px;font-size:10px}.live-player-info strong{font-size:12px}.live-player-info span{font-size:9px}.goalie-mark{font-size:13px}}

function buildGlobalTeams(list,perTeam){const lineQuota=perTeam-1,gks=list.filter(p=>p.position==='Goleiro'),lines=list.filter(p=>p.position!=='Goleiro');const count=Math.floor(lines.length/lineQuota);if(count<2)return null;const gkSlots=Math.min(count,gks.length);const targets=Array.from({length:count},(_,i)=>i<gkSlots?perTeam:lineQuota);let best=null;const attempts=Math.max(1200,list.length*180);for(let k=0;k<attempts;k++){const groups=Array.from({length:count},()=>[]),kg=[...gks].sort(()=>Math.random()-.5);for(let i=0;i<gkSlots;i++)groups[i].push(kg[i]);const usedGk=new Set(kg.slice(0,gkSlots).map(p=>p.id));const candidates=[...lines,...kg.filter(p=>!usedGk.has(p.id))].sort(()=>Math.random()-.5);candidates.forEach(p=>{const possible=groups.map((t,i)=>({i,power:teamPower(t),len:t.length})).filter(x=>x.len<targets[x.i]).sort((a,b)=>a.power-b.power||a.len-b.len);if(possible.length)groups[possible[0].i].push(p)});if(groups.some((t,i)=>t.length!==targets[i]))continue;const score=globalScore(groups);if(!best||score<best.score)best={groups:groups.map(t=>[...t]),score};if(score===0)break}if(!best)return null;const used=new Set(best.groups.flat().map(p=>p.id));return {groups:best.groups,leftovers:list.filter(p=>!used.has(p.id)),score:best.score}}

function waitingOrderIds(){
  const seen=new Set(),out=[];
  // Times completos já na espera têm prioridade, na ordem em que estavam no rodízio.
  state.rotationTeams.forEach(team=>team.forEach(id=>{if(!seen.has(id)){seen.add(id);out.push(id)}}));
  // Depois entram os jogadores avulsos, mantendo rigorosamente a ordem da fila.
  state.queue.forEach(id=>{if(!seen.has(id)){seen.add(id);out.push(id)}});
  return out;
}
function outsideLinePlayers(){return waitingOrderIds().map(id=>state.players.find(p=>p.id===id)).filter(p=>p&&p.position!=='Goleiro')}

function buildWithCurrentGoalkeepers(match){
  const lineCount=+state.settings.linePlayersPerTeam||4,available=outsideLinePlayers();
  if(available.length<lineCount*2)return null;
  const chosen=available.slice(0,lineCount*2),gkA=match.teams.a.find(p=>p.position==='Goleiro'),gkB=match.teams.b.find(p=>p.position==='Goleiro');

    for(let i=start;i<chosen.length;i++)comb(i+1,[...picked,chosen[i]]);

  comb(0,[]);return best;
}
function chooseLoserStayers(loserLine,need,incomingLine,winner){
  if(need<=0)return [];
  // Regra: quem fica do time derrotado é sempre quem chegou mais cedo na pelada, sem olhar equilíbrio.
  const rank=id=>{const i=state.arrivalOrder.indexOf(id);return i===-1?Infinity:i};
  return [...loserLine].sort((a,b)=>rank(a.id)-rank(b.id)).slice(0,need);
}
function prepareRotation(stayTeam,exitTeam){
  const size=(+state.settings.linePlayersPerTeam||4)+1;
  const ordered=waitingOrderIds().map(id=>state.players.find(p=>p.id===id)).filter(Boolean);
  const exitGK=exitTeam.find(p=>p.position==='Goleiro')||null;
  const waitingGK=ordered.find(p=>p.position==='Goleiro')||null;
  // Regra: o goleiro só troca por outro goleiro. Se tem um esperando, ele entra; senão o goleiro atual continua jogando.
  const nextGK=waitingGK||exitGK;
  const orderedLine=ordered.filter(p=>p.position!=='Goleiro'&&p.id!==nextGK?.id);
  const lineSlots=size-1;
  const incoming=orderedLine.slice(0,Math.min(lineSlots,orderedLine.length));
  const need=Math.max(0,lineSlots-incoming.length);
  const exitLine=exitTeam.filter(p=>p.position!=='Goleiro'&&p.id!==nextGK?.id);
  const keep=chooseLoserStayers(exitLine,need,incoming,stayTeam);
  const next=nextGK?[nextGK,...incoming,...keep]:[...incoming,...keep];
  const keepIds=new Set(keep.map(p=>p.id));
  const usedIncoming=new Set(incoming.map(p=>p.id));
  // Quem saiu do time derrotado (e não é o próximo goleiro) vai para o fim da fila.
  const exited=exitTeam.filter(p=>!keepIds.has(p.id)&&p.id!==nextGK?.id);
  const remainingWait=ordered.filter(p=>!usedIncoming.has(p.id)&&p.id!==nextGK?.id);
  state.rotationTeams=[];
  state.queue=[...remainingWait.map(p=>p.id),...exited.map(p=>p.id)];
  return next;
}
window.finalize=(drawExit='')=>{const m=state.activeMatch;if(drawExit==='both'&&!canBothExit()){alert(`Para saírem os dois times, é preciso ter pelo menos ${(+state.settings.linePlayersPerTeam||4)*2} jogadores de linha na espera.`);return}const w=m.score.a===m.score.b?null:(m.score.a>m.score.b?'a':'b');state.history.unshift({...m});if(state.session.active&&!state.session.matchIds.includes(m.id))state.session.matchIds.push(m.id);const sideMap={};(m.initialIds?.a||[]).forEach(id=>sideMap[id]='a');(m.initialIds?.b||[]).forEach(id=>sideMap[id]='b');m.events.filter(e=>e.type==='sub').forEach(e=>{sideMap[e.outId]=e.team;sideMap[e.inId]=e.team});Object.entries(sideMap).forEach(([id,side])=>{const p=state.players.find(x=>x.id===id);if(!p)return;p.stats=Object.assign({matches:0,wins:0,draws:0,losses:0,goals:0,assists:0,goalieMatches:0,goalsConceded:0},p.stats||{});p.stats.matches++;p.stats.goals+=m.events.filter(e=>e.type==='goal'&&e.playerId===id).length;p.stats.assists+=m.events.filter(e=>e.type==='goal'&&e.assistId===id).length;if(p.position==='Goleiro'){p.stats.goalieMatches++;p.stats.goalsConceded+=m.events.filter(e=>e.type==='goal'&&e.goalieId===id).length}if(!w)p.stats.draws++;else if(w===side)p.stats.wins++;else p.stats.losses++});

  }).join('');
  $('#app').innerHTML=`<section class="card hero"><div class="home-kicker">MEMÓRIA DA TURMA</div><h1>Histórico de peladas</h1><p class="muted">Toque em uma pelada para abrir partidas, estatísticas e pagamentos.</p></section><section class="card"><div class="date-filter"><label class="field">Filtrar por data<input type="date" value="${historyDateFilter}" onchange="setHistoryDate(this.value)"></label>${historyDateFilter?'<button class="btn btn-secondary" onclick="setHistoryDate(\'\')">Limpar</button>':''}</div></section>${cards||`<section class="card"><div class="empty"><div style="font-size:42px;margin-bottom:10px">📋</div><strong>${historyDateFilter?'Nenhuma pelada nesta data':'Nenhuma pelada encerrada'}</strong><p style="margin:8px 0 0">${historyDateFilter?'Escolha outra data ou limpe o filtro.':'Finalize uma pelada para guardar os dados aqui.'}</p></div></section>`}`;

function renderConfig(){const s=state.settings;$('#app').innerHTML=`<section class="card hero"><div class="small">REGRAS DA PELADA</div><h1>Configurações</h1><p class="muted">Defina as regras principais para as próximas partidas.</p></section><section class="card"><div class="small">⚽ IDENTIFICAÇÃO</div><h2>Nome da pelada</h2><label class="field">Nome<input value="${esc(s.peladaName||'')}" placeholder="Ex.: Arena Andrade" onchange="updateTextSetting('peladaName',this.value)"></label></section><section class="card"><div class="switch-row"><div><div class="small">👑 BAYER</div><h2 style="margin:3px 0">Ativar regra do Bayer</h2><div class="muted">Controla a sequência de vitórias durante a pelada.</div></div><button class="switch ${s.bayerEnabled?'on':''}" onclick="toggleBayer()" aria-label="Ativar ou desativar Bayer"></button></div>${s.bayerEnabled?`<div style="border-top:1px solid var(--line);margin-top:16px;padding-top:16px"><div class="row space"><strong>Vitórias seguidas</strong><strong style="font-size:28px;color:var(--accent)">${s.bayerWins}</strong></div><div class="row" style="margin-top:10px"><button class="btn btn-secondary" style="flex:1" onclick="changeCfg('bayerWins',-1)">−</button><div class="card" style="margin:0;flex:2;text-align:center;padding:12px"><strong>${s.bayerWins}</strong><div class="small">para completar o Bayer</div></div><button class="btn btn-secondary" style="flex:1" onclick="changeCfg('bayerWins',1)">+</button></div></div>`:''}</section><section class="card"><div class="row space"><div><div class="small">👥 FORMAÇÃO</div><h2>Jogadores na linha</h2></div><strong style="font-size:30px;color:var(--accent)">${s.linePlayersPerTeam}</strong></div><p class="muted">Quantidade de jogadores de linha em cada time. O goleiro é contado à parte.</p><div class="row"><button class="btn btn-secondary" style="flex:1" onclick="changeCfg('linePlayersPerTeam',-1)">−</button><div class="card" style="margin:0;flex:2;text-align:center;padding:12px"><strong>${s.linePlayersPerTeam} na linha + 1 goleiro</strong><div class="small">${s.linePlayersPerTeam+1} jogadores por time</div></div><button class="btn btn-secondary" style="flex:1" onclick="changeCfg('linePlayersPerTeam',1)">+</button></div></section><section class="card"><h2>Partida</h2><div class="formgrid"><label class="field">Minutos<input type="number" min="1" value="${s.minutes}" onchange="updateSetting('minutes',this.value)"></label><label class="field">Gols<input type="number" min="1" value="${s.goals}" onchange="updateSetting('goals',this.value)"></label></div></section><section class="card"><div class="small">👤 CONTA</div><div class="user-bar" style="margin-top:10px"><span class="muted">${esc(authUser?.email||'')}</span></div><button class="btn btn-secondary" style="width:100%;margin-top:12px" onclick="voltarMinhasPeladas()">🔀 Trocar de pelada</button><button class="btn btn-secondary" style="width:100%;margin-top:10px" onclick="sairDaConta()">Sair da conta</button></section><section class="card"><h2>Dados desta pelada</h2><p class="muted">Apaga jogadores, partidas e histórico só desta pelada, neste aparelho. As outras peladas não são afetadas.</p><button class="btn btn-danger" style="margin-top:10px" onclick="resetAll()">Apagar dados desta pelada</button></section>`}

/* ===== Link de confirmação de presença (Supabase) ===== */
function formatDateSimple(iso){if(!iso)return '';const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`}
function conviteLink(id){return location.origin+location.pathname+'?convite='+id}
let conviteSelected=new Set(),conviteJogadoresCache=[],conviteChannel=null;
let linkConviteInfo=null,linkConviteConfirmados=[],linkConviteLoading=false;
async function carregarConfirmadosDoLink(){
  const c=state.activeConvite||state.lastConvite;
  if(!c){linkConviteInfo=null;linkConviteConfirmados=[];return}
  if(linkConviteLoading||linkConviteInfo?.id===c.id)return;
  linkConviteLoading=true;
  const{data,error}=await sb.from('convite_jogadores').select('*').eq('convite_id',c.id).eq('status','confirmado');
  linkConviteLoading=false;
  if(error)return;
  linkConviteInfo={id:c.id,nome:c.nome};linkConviteConfirmados=data||[];
  if(tab==='partida'&&matchStep==='select')renderSelect();
}
window.usarConfirmadosDoLink=()=>{
  const ids=linkConviteConfirmados.map(j=>j.jogador_id).filter(id=>state.players.some(p=>p.id===id));
  if(!ids.length)return alert('Nenhum confirmado do link corresponde a jogadores cadastrados no momento.');
  chamadaPresentes=new Set(ids);matchStep='chamada';render();
};
function renderChamada(){
  const c=state.activeConvite||state.lastConvite;
  const lista=linkConviteConfirmados.map(j=>({...j,player:state.players.find(p=>p.id===j.jogador_id)})).filter(x=>x.player);
  $('#app').innerHTML=`<section class="card hero"><div class="small">CHAMADA</div><h1>Quem veio de verdade?</h1><p class="muted">Essas pessoas confirmaram presença no link${c?' de "'+esc(c.nome)+'"':''}. Desmarque quem não apareceu antes de montar os times.</p></section><section class="card"><div class="row space"><h2 style="margin-bottom:2px">Confirmados no link</h2><div class="small">${chamadaPresentes.size} de ${lista.length} presentes</div></div>${lista.length?`<div class="grid" style="margin-top:12px">${lista.map(j=>`<button class="player ${chamadaPresentes.has(j.jogador_id)?'selected':''}" onclick="toggleChamada('${j.jogador_id}')"><span class="check">${chamadaPresentes.has(j.jogador_id)?'✓':''}</span><strong>${esc(j.player.name)}</strong><span class="small">${esc(j.player.position)}</span></button>`).join('')}</div>`:'<div class="empty">Nenhum confirmado encontrado.</div>'}</section><div class="row"><button class="btn btn-secondary" style="flex:1" onclick="matchStep='select';render()">← Selecionar manualmente</button><button class="btn btn-primary" style="flex:2" onclick="confirmarChamada()">Continuar (${chamadaPresentes.size})</button></div>`;
}
window.toggleChamada=id=>{chamadaPresentes.has(id)?chamadaPresentes.delete(id):chamadaPresentes.add(id);renderChamada()};
window.confirmarChamada=()=>{selected=new Set(chamadaPresentes);const c=state.activeConvite||state.lastConvite;if(c?.nome)setPeladaName(c.nome);matchStep='select';render()};
window.toggleConviteSel=id=>{conviteSelected.has(id)?conviteSelected.delete(id):conviteSelected.add(id);renderConvite(true)};
window.toggleConviteAll=()=>{if(conviteSelected.size===state.players.length)conviteSelected.clear();else state.players.forEach(p=>conviteSelected.add(p.id));renderConvite(true)};
async function carregarConviteJogadores(id){const{data,error}=await sb.from('convite_jogadores').select('*').eq('convite_id',id).order('jogador_nome');if(!error)conviteJogadoresCache=data||[];if(tab==='convite')renderConvite(true)}
function assinarConviteRealtime(id){if(conviteChannel)sb.removeChannel(conviteChannel);conviteChannel=sb.channel('convite-'+id).on('postgres_changes',{event:'*',schema:'public',table:'convite_jogadores',filter:`convite_id=eq.${id}`},()=>carregarConviteJogadores(id)).subscribe()}
function renderConvite(skipLoad){
  if(!state.activeConvite){
    $('#app').innerHTML=`<section class="card hero"><div class="small">CONVOCAÇÃO</div><h1>Criar link de confirmação</h1><p class="muted">Monte o convite da pelada e mande o link no grupo do WhatsApp. Cada jogador confirma presença tocando no próprio nome.</p></section><section class="card"><div class="formgrid"><label class="field full">Nome da pelada<input id="cvNome" value="${esc(state.settings.peladaName||'')}" placeholder="Ex.: Pelada de sábado"></label><label class="field">Data<input id="cvData" type="date"></label><label class="field">Horário<div class="row" style="gap:8px"><select id="cvHoraH" style="flex:1">${Array.from({length:24},(_,h)=>`<option value="${String(h).padStart(2,'0')}" ${h===19?'selected':''}>${String(h).padStart(2,'0')}h</option>`).join('')}</select><select id="cvHoraM" style="flex:1">${['00','15','30','45'].map(m=>`<option value="${m}">${m}min</option>`).join('')}</select></div></label><label class="field full">Local<input id="cvLocal" placeholder="Ex.: Arena Andrade"></label><label class="field full">Prazo pra confirmar<select id="cvExpira"><option value="6">6 horas</option><option value="12" selected>12 horas</option><option value="24">24 horas</option><option value="48">48 horas</option><option value="0">Sem prazo (só eu encerro)</option></select><span class="small" style="display:block;margin-top:4px">Depois desse prazo, ninguém consegue mais mudar a resposta.</span></label></div></section><section class="card"><div class="row space"><h2>Quem convidar</h2><button class="btn btn-secondary" onclick="toggleConviteAll()">${conviteSelected.size===state.players.length&&state.players.length?'Desmarcar':'Selecionar todos'}</button></div>${state.players.length?`<div class="grid" style="margin-top:12px">${state.players.map(p=>`<button class="player ${conviteSelected.has(p.id)?'selected':''}" onclick="toggleConviteSel('${p.id}')"><span class="check">${conviteSelected.has(p.id)?'✓':''}</span><strong>${esc(p.name)}</strong></button>`).join('')}</div>`:'<div class="empty">Cadastre jogadores primeiro na aba Jogadores.</div>'}</section><div class="row"><button class="btn btn-secondary" style="flex:1" onclick="tab='pelada';render()">← Voltar</button><button class="btn btn-primary" style="flex:2${conviteSelected.size<1?';opacity:.5':''}" ${conviteSelected.size<1?'disabled':''} onclick="criarConvite()">Gerar link</button></div>`;
    return;
  }
  const c=state.activeConvite,link=conviteLink(c.id);
  if(!skipLoad){carregarConviteJogadores(c.id);assinarConviteRealtime(c.id)}
  const confirmados=conviteJogadoresCache.filter(j=>j.status==='confirmado').length,recusados=conviteJogadoresCache.filter(j=>j.status==='recusado').length,total=conviteJogadoresCache.length;
  $('#app').innerHTML=`<section class="card hero"><div class="small">LINK ATIVO</div><h1>${esc(c.nome)}</h1><p class="muted">${c.data?formatDateSimple(c.data)+' · ':''}${c.hora?c.hora+' · ':''}${esc(c.local||'')}</p></section><section class="card"><div class="small">${c.expira_em?'PRAZO PRA CONFIRMAR':'SEM PRAZO'}</div><strong style="display:block;margin-top:4px;font-size:16px">${c.expira_em?`Até ${new Date(c.expira_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}`:'Só encerra quando você tocar em "Encerrar este convite"'}</strong><p class="muted small" style="margin-top:4px">${c.expira_em?'Depois desse horário, a lista fecha sozinha e ninguém mais consegue responder.':''}</p></section><section class="card"><div class="small">LINK PARA O GRUPO</div><div class="row space" style="margin-top:8px;background:#081a30;border-radius:12px;padding:10px 12px"><span class="small" style="overflow-wrap:anywhere">${link}</span></div><div class="convite-share"><button class="btn btn-secondary" onclick="copiarLinkConvite()">📋 Copiar link</button><button class="btn btn-primary" onclick="compartilharConviteWhatsapp()">💬 Enviar no WhatsApp</button></div></section><section class="card"><div class="convite-counter">${confirmados} confirmado(s) · ${recusados} recusado(s) · ${total} convidado(s)</div>${conviteJogadoresCache.length?conviteJogadoresCache.map(j=>`<div class="convite-list-item"><strong>${esc(j.jogador_nome)}</strong><span class="convite-status ${j.status}">${j.status==='confirmado'?'✓ Confirmado':j.status==='recusado'?'✕ Não vai':'Aguardando'}</span></div>`).join(''):'<div class="empty">Carregando...</div>'}</section><button class="btn btn-danger" style="width:100%" onclick="encerrarConvite()">Encerrar este convite</button>`;
}
window.renderConvite=renderConvite;
window.criarConvite=async()=>{
  const nome=($('#cvNome').value||'').trim()||'Minha Pelada';
  const data=$('#cvData').value||null;
  const hora=`${$('#cvHoraH').value}:${$('#cvHoraM').value}`;
  const local=($('#cvLocal').value||'').trim()||null;
  const prazoH=+$('#cvExpira').value||0;
  const expiraEm=prazoH?new Date(Date.now()+prazoH*3600000).toISOString():null;
  const jogadores=state.players.filter(p=>conviteSelected.has(p.id));
  if(!jogadores.length)return alert('Selecione ao menos um jogador.');
  const{data:convite,error}=await sb.from('peladas_convite').insert({nome,data,hora,local,user_id:authUser?.id,expira_em:expiraEm}).select().single();
  if(error){alert('Não foi possível criar o convite. Verifique sua conexão e tente de novo.');console.error(error);return}
  const linhas=jogadores.map(p=>({convite_id:convite.id,jogador_id:p.id,jogador_nome:p.name,status:'pendente'}));
  const{error:err2}=await sb.from('convite_jogadores').insert(linhas);
  if(err2){alert('Convite criado, mas houve erro ao adicionar os jogadores.');console.error(err2);return}
  state.activeConvite=convite;save();conviteJogadoresCache=[];conviteSelected=new Set();
  render();
};
window.copiarLinkConvite=()=>{const link=conviteLink(state.activeConvite.id);navigator.clipboard?.writeText(link);alert('Link copiado!')};
window.compartilharConviteWhatsapp=()=>{const c=state.activeConvite,link=conviteLink(c.id);const texto=encodeURIComponent(`⚽ ${c.nome}\n${c.data?formatDateSimple(c.data)+' · ':''}${c.hora?c.hora+' · ':''}${c.local||''}\n\nConfirme sua presença: ${link}`);window.open(`https://wa.me/?text=${texto}`,'_blank')};
window.encerrarConvite=async()=>{
  if(!confirm('Encerrar este link de confirmação? Os jogadores não vão conseguir mais responder por ele.'))return;
  const c=state.activeConvite;
  const{error}=await sb.from('peladas_convite').update({encerrado:true}).eq('id',c.id);
  if(error){alert('Não deu pra encerrar agora, verifique sua conexão e tente de novo.');console.error(error);return}
  if(conviteChannel){sb.removeChannel(conviteChannel);conviteChannel=null}
  state.lastConvite={id:c.id,nome:c.nome};
  state.activeConvite=null;conviteJogadoresCache=[];save();tab='pelada';render()
};

/* ===== Página pública de confirmação (aberta por quem recebe o link) ===== */
async function iniciarPaginaConfirmacao(id){
  document.body.innerHTML=`<main class="convite-wrap" id="confirmApp"><div class="convite-loading">Carregando convite...</div></main>`;
  let{data:convite,error}=await sb.from('peladas_convite').select('*').eq('id',id).single();
  if(error||!convite){document.getElementById('confirmApp').innerHTML='<div class="convite-loading">Convite não encontrado. Peça o link certo pra quem organizou a pelada.</div>';return}
  async function renderLista(){
    const{data:jogadores}=await sb.from('convite_jogadores').select('*').eq('convite_id',id).order('jogador_nome');
    const expirado=!!(convite.expira_em&&new Date(convite.expira_em).getTime()<Date.now());
    const fechado=!!convite.encerrado||expirado;
    const confirmados=(jogadores||[]).filter(j=>j.status==='confirmado').length,total=(jogadores||[]).length;
    const prazoTxt=convite.expira_em&&!fechado?`Você tem até <strong>${new Date(convite.expira_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</strong> pra confirmar. Depois desse horário, a lista fecha sozinha.`:'';
    document.getElementById('confirmApp').innerHTML=`<section class="card convite-header"><div class="small">VOCÊ FOI CONVOCADO</div><h1>${esc(convite.nome)}</h1><p class="muted">${convite.data?formatDateSimple(convite.data)+' · ':''}${convite.hora?convite.hora+' · ':''}${esc(convite.local||'')}</p><p class="small" style="margin-top:10px">${fechado?`${convite.encerrado?'Esse convite foi encerrado pelo organizador.':'O prazo pra responder já passou.'} ${confirmados} confirmado(s) de ${total} convidado(s). As respostas não podem mais ser alteradas.`:'Toque no seu nome pra confirmar se você vai. Pode mudar de ideia à vontade até o prazo.'}</p>${prazoTxt?`<p class="small" style="margin-top:8px;color:#ffcf7d">⏰ ${prazoTxt}</p>`:''}</section><section class="card">${(jogadores||[]).map(j=>fechado?`<div class="convite-list-item"><strong>${esc(j.jogador_nome)}</strong><span class="convite-status ${j.status}">${j.status==='confirmado'?'✓ Vai':j.status==='recusado'?'✕ Não vai':'Não respondeu'}</span></div>`:`<div class="convite-list-item"><strong>${esc(j.jogador_nome)}</strong><span class="row" style="gap:6px"><button class="btn ${j.status==='confirmado'?'toggle-yn yes':'btn-secondary'}" style="padding:8px 12px" onclick="responderConvite('${j.id}','confirmado')">Vou</button><button class="btn ${j.status==='recusado'?'toggle-yn no':'btn-secondary'}" style="padding:8px 12px" onclick="responderConvite('${j.id}','recusado')">Não vou</button></span></div>`).join('')}</section>`;
  }
  window.responderConvite=async(jogadorId,status)=>{
    const expirado=!!(convite.expira_em&&new Date(convite.expira_em).getTime()<Date.now());
    if(convite.encerrado||expirado)return;
    const{error}=await sb.from('convite_jogadores').update({status}).eq('id',jogadorId);
    if(error){alert('Não deu pra confirmar agora, tenta de novo.');console.error(error);return}
    renderLista();
  };
  sb.channel('convite-pub-'+id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'peladas_convite',filter:`id=eq.${id}`},payload=>{convite=payload.new;renderLista()}).subscribe();
  renderLista();
}

      ${authMode==='login'?'<button class="btn btn-secondary" style="width:100%;margin-top:10px" onclick="recuperarSenha()">Esqueci minha senha</button>':''}
      <div class="auth-divider"><span>ou</span></div>
      <button class="btn btn-secondary" style="width:100%" onclick="entrarComGoogle()"><svg width="18" height="18" viewBox="0 0 48 48" style="vertical-align:-4px;margin-right:8px"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.3 18.9 12 24 12c3.1 0 5.8 1.1 8 3l6-6C34 5.1 29.3 3 24 3c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.1 36.4 26.7 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.9 40.8 16.4 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C40.9 36 44 30.5 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>Continuar com Google</button>
      ${authMsg?`<div class="auth-msg ${authMsg.tipo}">${esc(authMsg.texto)}</div>`:''}
    </section>
  </div></div>`);
}
function fecharAuth(){document.getElementById('authScreen')?.remove()}
function atualizarAuth(){fecharAuth();renderAuth()}
window.setAuthMode=m=>{authMode=m;authMsg=null;atualizarAuth()};
window.enviarAuth=async()=>{
  const email=(document.getElementById('authEmail').value||'').trim();
  const senha=document.getElementById('authSenha').value||'';
  if(!email||!senha){authMsg={tipo:'erro',texto:'Preencha e-mail e senha.'};return atualizarAuth()}
  if(senha.length<6){authMsg={tipo:'erro',texto:'A senha precisa ter pelo menos 6 caracteres.'};return atualizarAuth()}
  const btn=document.getElementById('authBtn');btn.disabled=true;btn.textContent='Aguarde...';
  if(authMode==='login'){
    const{error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error){authMsg={tipo:'erro',texto:error.message.includes('Invalid')?'E-mail ou senha incorretos.':error.message};return atualizarAuth()}
    authMsg=null;fecharAuth();iniciarApp();
  }else{
    const{data,error}=await sb.auth.signUp({email,password:senha});
    if(error){authMsg={tipo:'erro',texto:error.message.includes('already')?'Esse e-mail já tem conta. Use "Entrar".':error.message};return atualizarAuth()}
    if(data.session){authMsg=null;fecharAuth();iniciarApp()}
    else{authMode='login';authMsg={tipo:'ok',texto:'Conta criada! Confirme o e-mail que enviamos e depois entre.'};atualizarAuth()}
  }
};
window.recuperarSenha=async()=>{
  const email=(document.getElementById('authEmail').value||'').trim();
  if(!email){authMsg={tipo:'erro',texto:'Digite seu e-mail primeiro.'};return atualizarAuth()}
  const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  authMsg=error?{tipo:'erro',texto:error.message}:{tipo:'ok',texto:'Enviamos um link de redefinição pro seu e-mail.'};
  atualizarAuth();
};
window.entrarComGoogle=async()=>{
  const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
  if(error){authMsg={tipo:'erro',texto:error.message};atualizarAuth()}
};
window.sairDaConta=async()=>{
  if(!confirm('Sair da sua conta? Os dados desse aparelho continuam salvos aqui.'))return;
  if(conviteChannel){sb.removeChannel(conviteChannel);conviteChannel=null}
  await sb.auth.signOut();location.reload();
};

let appStarted=false,navBound=false,minhasPeladas=[],currentPelada=null;
function iniciarApp(){
  fecharAuth();
  if(appStarted)return;
  appStarted=true;
  mostrarMinhasPeladas();
}
function abrirPelada(peladaId,peladaMeta){
  LS='peladinha.pelada.'+peladaId;
  state=JSON.parse(localStorage.getItem(LS)||'null')||{players:[],history:[],peladaHistory:[],bayer:{name:null,wins:0},settings:{mode:'both',minutes:10,goals:3,bayerWins:3,linePlayersPerTeam:4,peladaName:peladaMeta?.nome||'Minha Pelada',goalkeeperPays:true},activeMatch:null,queue:[],paymentDraft:null};
  normalizarEstado();
  currentPelada=peladaMeta||currentPelada;
  clearInterval(timerHandle);
  tab='pelada';matchStep=state.paymentDraft?'payment':'select';selected=new Set();teams=state.preparedTeams||{a:[],b:[]};chamadaPresentes=new Set();
  document.getElementById('nav').style.display='';
  document.getElementById('backBtn').style.display='';
  if(!navBound){
    navBound=true;
    $('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;if(tab==='partida'&&!state.activeMatch)matchStep='select';render()}})
  }
  render();
}
window.voltarMinhasPeladas=()=>{clearInterval(timerHandle);mostrarMinhasPeladas()};
async function migrarPeladaAntiga(){
  try{
    const old=localStorage.getItem('peladinha.v3');
    if(!old)return;
    const parsed=JSON.parse(old);
    const nome=parsed?.settings?.peladaName||'Minha Pelada';
    const{data:p,error}=await sb.from('peladas').insert({user_id:authUser.id,nome}).select().single();
    if(error||!p)return;
    localStorage.setItem('peladinha.pelada.'+p.id,old);
  }catch(e){console.error(e)}
}
async function mostrarMinhasPeladas(){
  document.getElementById('nav').style.display='none';
  document.getElementById('backBtn').style.display='none';
  $('#pageTitle').textContent='Minhas peladas';
  $('#app').innerHTML='<div class="empty" style="padding:40px 0">Carregando suas peladas...</div>';
  const{data,error}=await sb.from('peladas').select('*').order('criado_em');
  if(error){$('#app').innerHTML='<div class="empty">Não deu pra carregar suas peladas agora. Puxe a tela pra atualizar.</div>';console.error(error);return}
  minhasPeladas=data||[];
  if(!minhasPeladas.length&&localStorage.getItem('peladinha.v3')){
    await migrarPeladaAntiga();
    const{data:data2}=await sb.from('peladas').select('*').order('criado_em');
    minhasPeladas=data2||[];
  }
  renderMinhasPeladas();
}
function renderMinhasPeladas(){
  $('#app').innerHTML=`<section class="card hero"><div class="small">SUA CONTA</div><h1>Minhas peladas</h1><p class="muted">Cada pelada tem jogadores, partidas e estatísticas independentes.</p></section>${minhasPeladas.map(p=>`<button class="card pelada-card" onclick="abrirPeladaRemota('${p.id}')"><div><strong>⚽ ${esc(p.nome)}</strong><div class="small">${esc([p.dia,p.horario].filter(Boolean).join(' · ')||'Sem dia/horário definido')}</div></div><span class="chev">→</span></button>`).join('')}${!minhasPeladas.length?'<div class="card empty">Você ainda não tem nenhuma pelada. Crie a primeira abaixo.</div>':''}<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="mostrarNovaPelada()">＋ Nova pelada</button><button class="btn btn-secondary" style="width:100%;margin-top:10px" onclick="sairDaConta()">Sair da conta</button>`;
}
window.mostrarNovaPelada=()=>{
  $('#pageTitle').textContent='Nova pelada';
  $('#app').innerHTML=`<section class="card hero"><div class="small">NOVA PELADA</div><h1>Criar pelada</h1><p class="muted">Dá pra ajustar mais regras depois, dentro de Configurações.</p></section><section class="card"><div class="formgrid"><label class="field full">Nome<input id="npNome" placeholder="Ex.: Arena Andrade"></label><label class="field full">Local<input id="npLocal" placeholder="Ex.: Arena Andrade"></label><label class="field">Dia<input id="npDia" placeholder="Ex.: Sábado"></label><label class="field">Horário<input id="npHorario" placeholder="Ex.: 19:00"></label></div></section><div class="row"><button class="btn btn-secondary" style="flex:1" onclick="renderMinhasPeladas()">← Voltar</button><button class="btn btn-primary" style="flex:2" onclick="criarPeladaNova()">Criar pelada</button></div>`;
};
window.criarPeladaNova=async()=>{
  const nome=($('#npNome').value||'').trim();
  if(!nome)return alert('Dá um nome pra pelada.');
  const local=($('#npLocal').value||'').trim()||null,dia=($('#npDia').value||'').trim()||null,horario=($('#npHorario').value||'').trim()||null;
  const{data,error}=await sb.from('peladas').insert({user_id:authUser.id,nome,local,dia,horario}).select().single();
  if(error){alert('Não foi possível criar a pelada. Verifique sua conexão e tente de novo.');console.error(error);return}
  minhasPeladas.push(data);
  window.abrirPeladaRemota(data.id);
};
window.abrirPeladaRemota=id=>{const meta=minhasPeladas.find(p=>p.id===id);abrirPelada(id,meta)};

async function bootstrap(){
  const urlConvite=new URLSearchParams(location.search).get('convite');
  if(urlConvite){iniciarPaginaConfirmacao(urlConvite);return}
  sb.auth.onAuthStateChange((event,session)=>{
    authUser=session?.user||null;
    if(authUser)iniciarApp();else if(!appStarted){renderAuth()}
  });
}
bootstrap();

</script>
